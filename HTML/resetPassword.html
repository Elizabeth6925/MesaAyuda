<!DOCTYPE html>
<!--------------------------------------------------------------------------------------------------------------------------->
<!-- resetPassword.html                                                                                                    -->                                                                                                     
<!-- Taller de maquetado - aplicación ejemplo Mesa de Ayuda                                                                -->                                                                                                     
<!-- UADER - Ingeniería de Software I                                                                                      -->                                                                                                     
<!--------------------------------------------------------------------------------------------------------------------------->
<html Lang="en">
   <head>
       <meta charset="UTF-8">
       <meta http-equiv="X-UA-Compatible" content="IE=edge">
       <meta name="viewport" content="width=device-width,initial-scale=1.0">
       <title>Reset Password - Mesa de Ayuda</title>
       <style type="text/css">
           label { font-size: 18px; }
           form { width: 500px; border: 1px solid black; }
           input { margin: 7px; padding: 2px; }
           .form-label { margin-bottom:0!important; }    
           .txt { display: inline-block; width: 80%; outline: none; margin:0; }
       </style>
   </head>
<body>
   <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
   <center>
       <h1>Sistema de Mesa de Ayuda</h1>
       <h2>Reset de contraseña</h2>
   </center>
   <center>
   <form id="formReset" class="form" style="background-color:#d8f7cf" width="100px" border="1">
       <br>
       <table>
           <tr style="height:10px;">
               <td><label for="contacto" class="form-label">E-Mail</label></td>              
           </tr>
           <tr style="height:10px;">   
               <td><input class="txt" id="contacto" name="contacto" type="email" placeholder="correo@ejemplo.com" required><br></td>
           </tr>
           <tr><td>&nbsp;</td></tr>
           
           <!-- NUEVO CAMPO: Contraseña actual -->
           <tr style="height:10px;">
               <td><label for="passwordActual" class="form-label">Contraseña Actual</label></td>              
           </tr>
           <tr>   
               <td><input class="txt" id="passwordActual" name="passwordActual" type="password" placeholder="Tu contraseña actual" required><br></td>
           </tr>
           <tr><td>&nbsp;</td></tr>

           <tr style="height:10px;">
               <td><label for="password" class="form-label">Nueva contraseña</label></td>              
           </tr>
           <tr>   
               <td><input class="txt" id="password" name="password" type="password" placeholder="Nueva contraseña" required><br></td>
           </tr>
           <tr><td>&nbsp;</td></tr>
           <tr style="height:10px;">
               <td><label for="password2" class="form-label">Repetir nueva contraseña</label></td>              
           </tr>
           <tr>   
               <td><input class="txt" id="password2" name="password2" type="password" placeholder="Repetir nueva contraseña" required><br></td>
           </tr>
          
           <!-- Contenedor del mensaje centrado -->
           <tr><td><span id="resultado" style="text-align:center; display:block;"></span></td></tr>
           <tr><td><br></td></tr>
       </table>
      
       <button type="submit">< Cambiar contraseña</button>
       <p></p>
       <!-- El link se queda acá siempre -->
       <center><a href="loginClient.html">Volver al login</a></center>
       <p></p>
   </form>
   </center>
   <script src="resetPassword.js" type="module"></script>
</body>
</html>
